# Render Blueprint — optional: New > Blueprint > connect repo
services:
  - type: web
    name: imali-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: GOOGLE_CLIENT_ID
        sync: false
